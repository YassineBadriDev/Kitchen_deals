<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g transform="translate(150,80)">
    <!-- Chef hat icon -->
    <path d="M30,80 L30,50 C30,30 45,15 60,15 C75,15 90,30 90,50 L90,80 Z" fill="#3c5b0a" opacity="0.2"/>
    <rect x="25" y="80" width="70" height="15" rx="3" fill="#3c5b0a" opacity="0.2"/>
    <!-- Price tag -->
    <rect x="55" y="55" width="30" height="20" rx="2" fill="#fee348" opacity="0.5"/>
    <text x="70" y="69" font-family="system-ui" font-size="10" fill="#3c5b0a" text-anchor="middle" opacity="0.6">%</text>
  </g>
  <text x="200" y="200" font-family="system-ui" font-size="14" fill="#999" text-anchor="middle">Kitchen Deal</text>
  <text x="200" y="220" font-family="system-ui" font-size="11" fill="#bbb" text-anchor="middle">kitchendeals.org</text>
