name: Kitchen Deals Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kitchen-deals-scrape
  cancel-in-progress: false

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          # Chrome-profile scraper needs a local Chrome profile/cookies and is
          # skipped on CI. HTTP + Playwright + Stealth scrapers run here.
          SCRAPE_PROFILE: 'false'
          SCRAPE_PLAYWRIGHT: 'true'
          SCRAPE_STEALTH: 'true'
          SCRAPE_HTTP: 'true'
        run: node src/scraping/scheduler.js --once

      - name: Push data to Cloudflare Worker
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node scripts/push-to-worker.js --url https://kitchendeals.org

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh scraped deals data"
            git push
          else
            echo "No data changes to commit"
          fi
